# Render blueprint for the live dashboard.
#
# This deploys the real engine, not the recorded snapshot in docs/. The gateway
# and both model servers run as actual processes inside the container, exactly
# as they do locally, and every figure on the page is read from them.
#
# DOUBLEBLIND_SECRET is generated by Render rather than written here. It is the
# root from which the party and audit keys are derived, so committing a value
# would publish the ability to forge audit entries for every deployment that
# used this file.
#
# The disk is deliberately absent. artifacts/live-audit.log is recreated on
# every start (harness.start uses fresh_audit=True), so there is nothing worth
# persisting, and a free instance that sleeps would otherwise wake with a log
# whose chain belongs to a previous process.

services:
  - type: web
    name: doubleblind-dashboard
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.dashboard
    dockerContext: .
    plan: free
    healthCheckPath: /api/status
    envVars:
      # Refuses /api/dna and the audit tamper endpoints. They write to disk and
      # restart the engine, and this URL is public with no authentication.
      - key: DOUBLEBLIND_HOSTED
        value: "1"
      - key: DOUBLEBLIND_SECRET
        generateValue: true
